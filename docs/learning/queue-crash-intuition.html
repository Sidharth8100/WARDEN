<div id="warden-crash-lesson">
  <h3>One processor job, one worker crash</h3>
  <div class="viz-controls">
    <label class="form-label" for="warden-crash-design">Processing design
      <select class="form-select" id="warden-crash-design">
        <option value="receipt">Save + durable job receipt, then acknowledge</option>
        <option value="duplicate">Save, then acknowledge, without a job receipt</option>
        <option value="early">Acknowledge before saving</option>
      </select>
    </label>
    <label class="form-label" for="warden-crash-step">Event <span id="warden-crash-index" class="tabular-nums">1 / 6</span>
      <input class="form-range" id="warden-crash-step" type="range" min="0" max="5" step="1" value="0">
    </label>
  </div>
  <ol id="warden-crash-events" aria-label="Job recovery timeline"></ol>
  <div class="viz-grid" aria-live="polite" aria-atomic="true">
    <div><strong>Queue tracking</strong><div id="warden-crash-queue"></div></div>
    <div><strong>Worker</strong><div id="warden-crash-worker"></div></div>
    <div><strong>Durable business effects</strong><div id="warden-crash-effects" class="tabular-nums"></div></div>
  </div>
  <p id="warden-crash-detail" aria-live="polite"></p>
</div>
<style>
  #warden-crash-lesson { color: var(--foreground); }
  #warden-crash-events { display: grid; gap: 8px; padding-inline-start: 24px; }
  #warden-crash-events li { padding-inline-start: 6px; }
  #warden-crash-events li[aria-current="step"] { font-weight: 500; }
  #warden-crash-events li::marker { color: var(--muted-foreground); }
  #warden-crash-events li[aria-current="step"]::marker { color: var(--viz-series-1); }
</style>
<script>
(() => {
  const root = document.getElementById('warden-crash-lesson');
  const design = root.querySelector('#warden-crash-design');
  const slider = root.querySelector('#warden-crash-step');
  const timeline = root.querySelector('#warden-crash-events');
  const position = root.querySelector('#warden-crash-index');
  const queue = root.querySelector('#warden-crash-queue');
  const worker = root.querySelector('#warden-crash-worker');
  const effects = root.querySelector('#warden-crash-effects');
  const detail = root.querySelector('#warden-crash-detail');
  const choices = ['receipt', 'duplicate', 'early'];
  function restore(saved) {
    const value = saved && saved.modelContent;
    if (!value) return;
    if (choices.includes(value.design)) design.value = value.design;
    if (Number.isInteger(value.step) && value.step >= 0 && value.step <= 5) slider.value = value.step;
  }
  function draw() {
    const step = Number(slider.value);
    const early = design.value === 'early';
    const receipt = design.value === 'receipt';
    const labels = ['Job J42 enqueued', 'Worker A claims J42', early ? 'Worker A acknowledges J42 early' : 'Worker A commits the database transaction', 'Worker A crashes before its next action', 'Worker B looks for unfinished claims', 'Recovery completes'];
    timeline.replaceChildren();
    labels.forEach((label, index) => {
      const item = document.createElement('li');
      item.textContent = label;
      if (index === step) item.setAttribute('aria-current', 'step');
      timeline.appendChild(item);
    });
    position.textContent = `${step + 1} / 6`;
    queue.textContent = step === 0 ? 'Ready' : early && step >= 2 ? 'Acknowledged; no pending claim' : step === 5 ? 'Acknowledged after recovery' : step === 4 ? 'Pending; reclaimed by B' : 'Pending; assigned to A';
    worker.textContent = step === 0 ? 'Idle' : step <= 2 ? 'A running' : step === 3 ? 'A stopped' : step === 4 ? 'B checks recovery' : early ? 'B finds no claim to recover' : 'B finishes J42';
    const count = early || step < 2 ? 0 : step === 5 && !receipt ? 2 : 1;
    effects.textContent = String(count);
    const descriptions = ['The queue retains the job until a worker takes responsibility.', 'A claim records unfinished responsibility; it is not completion.', early ? 'The queue stops tracking unfinished work before the database has saved it.' : receipt ? 'The effect and the unique receipt for J42 commit together.' : 'The effect commits, but no durable record identifies J42 as already applied.', 'Process memory disappears; the queue and database survive in this example.', early ? 'The message may remain in stream history, but normal pending-claim recovery cannot find it.' : 'After the idle threshold, B can take over the unacknowledged job.', early ? 'Lost work: zero effects, with no pending claim left to retry.' : receipt ? 'B recognizes the committed receipt: one effect despite repeated delivery.' : 'B applies J42 again: two effects from one logical job.'];
    detail.textContent = descriptions[step];
  }
  function change() {
    draw();
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({modelContent: {design: design.value, step: Number(slider.value)}, privateContent: null}).catch(() => {});
    }
  }
  restore(window.openai && window.openai.widgetState);
  design.addEventListener('change', change);
  slider.addEventListener('input', change);
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && globals.widgetState) { restore(globals.widgetState); draw(); }
  });
  draw();
})();
</script>
