[project]
name = "warden"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "warden-core",
    "warden-db",
    "warden-net",
    "warden-fetch",
    "warden-compare",
    "warden-api",
    "chaos-web",
    "redis>=8.1.0",
    "warden-redis",
    "warden-scheduler",
    "warden-fetcher",
    "warden-processor",
    "warden-rules",
    "warden-observe",
    "warden-alerter",
    "warden-analytics",
]

[tool.uv]
package = false            # the root is just a container; don't build it

[tool.uv.workspace]
members = [
    "libs/warden_core",
    "libs/warden_db",
    "libs/warden_net",
    "libs/warden_fetch",
    "libs/warden_compare",
    "libs/warden_redis",
    "services/api",
    "services/scheduler",
    "services/fetcher",
    "services/processor",
    "sim/chaos_web",
    "libs/warden_rules",
    "libs/warden_observe",
    "services/alerter",
    "services/analytics",
]

[tool.uv.sources]
warden-core = { workspace = true }
warden-db = { workspace = true }
warden-net = { workspace = true }
warden-fetch = { workspace = true }
warden-compare = { workspace = true }
warden-api = { workspace = true }
chaos-web = { workspace = true }
warden-redis = { workspace = true }
warden-scheduler = { workspace = true }
warden-fetcher = { workspace = true }
warden-processor = { workspace = true }
warden-rules = { workspace = true }
warden-observe = { workspace = true }
warden-alerter = { workspace = true }
warden-analytics = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.21.0",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]



[tool.pytest.ini_options]
testpaths = ["libs", "services", "sim"]
addopts = "--import-mode=importlib -m 'not integration and not selenium and not chaos_web'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Custom markers let us tag slow / infra-dependent tests and skip them
# in environments without a real database (e.g. CI without Docker).
# Usage in a test file: @pytest.mark.integration
# Run only integration tests: uv run pytest -m integration
# Run only unit tests:        uv run pytest -m "not integration"
markers = [
    "integration: requires a live PostgreSQL database (deselect with -m 'not integration')",
    "student_todo: tests for student-implemented functions (run with make check-todos)",
    "selenium: requires a live Selenium Grid hub",
    "chaos_web: requires a live chaos-web service",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    # Auto-generated Alembic migration files. Ruff can't fix these reliably
    # because they contain Alembic-generated code we must not alter.
    "libs/warden_db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["warden_core", "warden_db", "warden_net", "warden_fetch", "warden_compare", "warden_redis", "warden_scheduler", "warden_fetcher", "warden_processor", "warden_api", "chaos_web"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]
"sim/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "libs/warden_core/src",
    "libs/warden_db/src",
    "libs/warden_net/src",
    "libs/warden_fetch/src",
    "libs/warden_compare/src",
    "libs/warden_redis/src",
    "services/api/src",
    "services/scheduler/src",
    "services/fetcher/src",
    "services/processor/src",
    "sim/chaos_web/src",
    "libs/warden_rules/src",
    "libs/warden_observe/src",
    "services/alerter/src",
    "services/analytics/src",
]
explicit_package_bases = true

# The pydantic mypy plugin teaches mypy how pydantic model fields work.
# Without it, mypy complains about missing __init__ arguments on BaseSettings
# subclasses (because pydantic generates __init__ dynamically at runtime).
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Warn when a pydantic model field has an annotation but no default and no
# validator - helps catch missing required fields at type-check time.
init_forbid_extra = true
warn_required_dynamic_aliases = true
