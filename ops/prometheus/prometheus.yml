global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: warden-api
    static_configs:
      - targets: ['api:8000', 'api2:8000']
  - job_name: warden-workers
    static_configs:
      - targets: ['scheduler:9100', 'fetcher:9100', 'processor:9100', 'alerter:9100']
