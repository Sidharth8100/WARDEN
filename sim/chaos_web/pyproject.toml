[project]
name = "chaos-web"
version = "0.1.0"
description = "Synthetic test internet and ground truth generator for WARDEN"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_web"]
