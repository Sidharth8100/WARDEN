name: warden

# ==============================================================================
# WHAT IS DOCKER COMPOSE?
# ==============================================================================
# Docker Compose lets you define and run multi-container applications.
# Instead of running `docker run` with many flags for each service, you write
# this YAML file and run `docker compose up` to start everything at once.
#
# Each entry under `services:` is a separate container:
#   postgres     - the database (PostgreSQL 16)
#   redis        - the cache / message broker (Redis 7)
#   objectstore  - the file/blob storage (SeaweedFS, S3-compatible)
#   mailpit      - catches outgoing emails in development (fake SMTP server)
#   migrate      - one-shot container that runs Alembic migrations
#   api          - the FastAPI application
#
# `depends_on` with `condition` controls startup ORDER:
#   - migrate waits for postgres to be "healthy" before running
#   - api waits for migrate to "complete successfully" before starting
#
# NETWORK SAFETY
# Services use the Compose project's user-defined bridge, with service-name DNS.
# The local override selects a subnet checked against the host's actual routes.
# Before creating networks, follow docs/STANDING_RULES.md: never use 172.17/16,
# and do not rely on automatic allocation without checking daemon address pools.
# ==============================================================================

services:

  # ============================================================================
  # POSTGRES - The primary relational database.
  # ============================================================================
  postgres:
    image: postgres:16
    environment:
      # ${VAR:?message} means: read from .env; if missing, abort with message.
      # This prevents accidentally starting with empty credentials.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: persists data between `docker compose down` restarts.
      # NOT deleted by `docker compose down` (only by `docker compose down -v`).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready: Postgres's built-in readiness check. Returns 0 when the
      # server is ready to accept connections. Docker uses this to know when
      # it's safe for migrate/api to start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================================
  # REDIS - In-memory key/value store. Used for: client lifecycle tracking
  # and the health check PING. Future uses: rate limiting, session storage.
  # ============================================================================
  redis:
    image: redis:7
    # AOF (Append-Only File) persistence: every write command is logged to disk.
    # everysec: flush to disk once per second (good balance of safety vs speed).
    # This means at most 1 second of data loss if Redis crashes.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--aclfile", "/etc/redis/users.acl"]
    env_file: [.runtime/redis-health.env]
    volumes:
      - redisdata:/data
      - ./redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================================
  # OBJECTSTORE - SeaweedFS with S3-compatible API.
  # Used to store snapshots (HTML content, screenshots) and blobs.
  # Accessible inside the compose network at http://objectstore:8333
  # ============================================================================
  objectstore:
    image: chrislusf/seaweedfs
    # "server" mode runs master + volume server + filer + S3 gateway in one process.
    # -s3: enable the S3-compatible API
    # -s3.port=8333: the S3 API listens on port 8333
    # -dir=/data: store all data in the named volume
    command: ["server", "-s3", "-dir=/data", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3config.json"]
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro

  # ============================================================================
  # MAILPIT - Development-only fake SMTP server.
  # Catches all outgoing emails and shows them in a web UI. Nothing actually
  # gets delivered. Prevents accidentally sending real emails during dev.
  # ============================================================================
  mailpit:
    image: axllent/mailpit

  # ============================================================================
  # MIGRATE - One-shot migration runner.
  # Runs `alembic upgrade head` once at startup and then exits.
  # docker compose tracks its exit code: 0 = success, non-zero = failure.
  #
  # WHY A SEPARATE CONTAINER?
  # Running migrations in the API container would mean:
  #   - Every API instance (in a scaled cluster) tries to run migrations
  #   - Race conditions between concurrent migration runs
  # The migrate service runs exactly once per `docker compose up` call,
  # before the API starts, ensuring clean sequential migration.
  # ============================================================================
  migrate:
    # Same image as the API - it has alembic and our models installed.
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      [
        "alembic",
        "-c", "/app/db/alembic.ini",
        "upgrade", "head",
      ]
    environment:
      # Inside the compose network, Postgres is reachable as "postgres" (the
      # service name), not "localhost". Docker's internal DNS resolves service
      # names to container IPs automatically.
      WARDEN_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      WARDEN_OBJECTSTORE_URL: "http://objectstore:9333"
      WARDEN_ALEMBIC_INI_PATH: "/app/db/alembic.ini"
    depends_on:
      postgres:
        # "service_healthy" means: wait until postgres's healthcheck returns OK.
        # This prevents migration from starting while Postgres is still booting.
        condition: service_healthy
    # restart: "no" means: if migrations fail, don't retry automatically.
    # We want a clean failure signal, not an infinite retry loop.
    restart: "no"

  # ============================================================================
  # API - The FastAPI application.
  # Starts ONLY after migrate completes successfully.
  # ============================================================================
  api: &api
    env_file: [.runtime/api.env]
    volumes:
      - ./keys:/app/keys:ro
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &api_environment
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      WARDEN_SLO_SAMPLER: "1"
      WARDEN_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      WARDEN_OBJECTSTORE_URL: "http://objectstore:9333"
      WARDEN_ALEMBIC_INI_PATH: "/app/db/alembic.ini"
      WARDEN_LOG_LEVEL: "${WARDEN_LOG_LEVEL:-INFO}"
      WARDEN_JSON_LOGS: "${WARDEN_JSON_LOGS:-true}"
      WARDEN_SSRF_TEST_ALLOWLIST: '["chaos-web"]'
    ports:
      # Bind to 127.0.0.1 ONLY - never 0.0.0.0 (project constraint).
      # The API is reachable from your laptop at http://localhost:18000
      # but NOT from other machines on the network.
      - "127.0.0.1:18000:8000"
    depends_on:
      migrate:
        # "service_completed_successfully" means: wait until the migrate
        # container exits with code 0 (success). If it exits with non-zero
        # (migration failed), the API will NOT start.
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # CHAOS-WEB - Synthetic test internet and ground truth generator.
  # Serves page archetypes (price, jobs, app/SPA) with mutation engine and
  # ground-truth log endpoints for classifier and pipeline evaluation.
  # No published ports - reachable only within the Compose network.
  # ============================================================================
  chaos-web:
    build:
      context: .
      dockerfile: sim/chaos_web/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # SELENIUM-HUB - Central hub for Selenium Grid 4.
  # Coordinates browser sessions dispatched to worker nodes (chrome).
  # ============================================================================
  selenium-hub:
    image: selenium/hub:4.25.0
    ports:
      - "127.0.0.1:4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # CHROME - Selenium Grid node running headless Chrome browser sessions.
  # Requires shm_size: "2gb" to avoid browser rendering crashes.
  # ============================================================================
  chrome:
    image: selenium/node-chrome:4.25.0
    shm_size: "2gb"
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
    depends_on:
      selenium-hub:
        condition: service_healthy
    restart: unless-stopped

  api2:
    <<: *api
    environment:
      <<: *api_environment
      WARDEN_SLO_SAMPLER: "0"
    ports:
      - "127.0.0.1:18001:8000"

  objectstore-bootstrap:
    build:
      context: .
      dockerfile: services/fetcher/Dockerfile
    env_file: [.runtime/bootstrap.env]
    command: ["python", "-m", "warden_net.bootstrap"]
    depends_on:
      objectstore:
        condition: service_started
    restart: on-failure

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    env_file: [.runtime/scheduler.env]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      WARDEN_METRICS_PORT: "9100"
      WARDEN_METRICS_BIND: "0.0.0.0"
      WARDEN_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  fetcher:
    build:
      context: .
      dockerfile: services/fetcher/Dockerfile
    env_file: [.runtime/fetcher.env]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      WARDEN_METRICS_PORT: "9100"
      WARDEN_METRICS_BIND: "0.0.0.0"
      WARDEN_SSRF_ALLOWLIST: "chaos-web"
    depends_on:
      redis:
        condition: service_healthy
      objectstore-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    env_file: [.runtime/processor.env]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      WARDEN_METRICS_PORT: "9100"
      WARDEN_METRICS_BIND: "0.0.0.0"
      WARDEN_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      objectstore-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  alerter:
    build:
      context: .
      dockerfile: services/alerter/Dockerfile
    environment:
      WARDEN_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      WARDEN_SMTP_HOST: mailpit
      WARDEN_SMTP_PORT: "1025"
      WARDEN_METRICS_PORT: "9100"
      WARDEN_METRICS_BIND: "0.0.0.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports: ['127.0.0.1:19090:9090']
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--cluster.listen-address=']
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    ports: ['127.0.0.1:19093:9093']
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ['127.0.0.1:13000:3000']
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    # Local development uses bounded, transient all-in-one memory storage.
    ports: ['127.0.0.1:16686:16686']
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  objectdata: {}
  prometheusdata: {}
  alertmanagerdata: {}
  grafanadata: {}
