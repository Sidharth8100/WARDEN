[project]
name = "warden-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=26.1.0",
    "warden-compare",
    "warden-core",
    "warden-db",
    "warden-net",
    "warden-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_processor"]

[tool.uv.sources]
warden-core = { workspace = true }
warden-net = { workspace = true }
warden-compare = { workspace = true }
warden-db = { workspace = true }
warden-redis = { workspace = true }
