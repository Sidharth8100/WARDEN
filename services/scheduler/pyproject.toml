[project]
name = "warden-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=26.1.0",
    "warden-core",
    "warden-db",
    "warden-observe",
    "warden-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_scheduler"]

[tool.uv.sources]
warden-core = { workspace = true }
warden-db = { workspace = true }
warden-redis = { workspace = true }
warden-observe = { workspace = true }
