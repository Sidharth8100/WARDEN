[project]
name = "warden-alerter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=26.1.0",
    "warden-db",
    "warden-net",
    "warden-observe",
    "warden-redis",
    "warden-rules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_alerter"]

[tool.uv.sources]
warden-db = { workspace = true }
warden-net = { workspace = true }
warden-rules = { workspace = true }
warden-redis = { workspace = true }
warden-observe = { workspace = true }
