[project]
name = "warden-api"
version = "0.1.0"
description = "WARDEN FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "cssselect>=1.2.0",
    "email-validator>=2.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=5.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.8.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "warden-core",
    "warden-db",
    "warden-net",
    "warden-fetch",
    "warden-compare",
    "zxcvbn>=4.4.28",
]

[tool.uv.sources]
warden-core = { workspace = true }
warden-db = { workspace = true }
warden-net = { workspace = true }
warden-fetch = { workspace = true }
warden-compare = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_api"]
