[project]
name = "warden-api"
version = "0.1.0"
description = "WARDEN FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "warden-core",
    "warden-db",
]

[tool.uv.sources]
warden-core = { workspace = true }
warden-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_api"]