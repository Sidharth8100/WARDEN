[project]
name = "warden-api"
version = "0.1.0"
description = "WARDEN FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "warden-core",
    "warden-db",
]

[tool.uv.sources]
warden-core = { workspace = true }
warden-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_api"]
