[project]
name = "warden-compare"
version = "0.1.0"
description = "Deterministic DOM normalization, structural diffing, and classification for WARDEN"
requires-python = ">=3.12"
dependencies = [
    "cssselect>=1.2.0",
    "lxml>=5.0.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "scikit-image>=0.24.0",
    "structlog>=26.1.0",
    "warden-core",
    "zstandard>=0.23.0",
]

[tool.uv.sources]
warden-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_compare"]
