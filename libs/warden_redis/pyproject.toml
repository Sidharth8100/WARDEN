[project]
name = "warden-redis"
version = "0.1.0"
description = "Shared authenticated Redis protocols for WARDEN"
requires-python = ">=3.12"
dependencies = [
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "warden-core",
]

[tool.uv.sources]
warden-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_redis"]
