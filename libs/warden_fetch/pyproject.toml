[project]
name = "warden-fetch"
version = "0.1.0"
description = "Tier-1 and Tier-2 network and browser fetch library for WARDEN"
requires-python = ">=3.12"
dependencies = [
    "protego>=0.7.0",
    "selenium>=4.25.0",
    "structlog>=26.1.0",
    "tenacity>=9.0.0",
    "warden-core",
    "warden-net",
    "warden-redis",
]

[tool.uv.sources]
warden-core = { workspace = true }
warden-net = { workspace = true }
warden-redis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_fetch"]
