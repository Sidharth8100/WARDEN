[project]
name = "warden-net"
version = "0.1.0"
description = "Safe URL canonicalization and fetch library for WARDEN"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "idna>=3.7",
    "tldextract>=5.1.0",
    "warden-core",
]

[tool.uv.sources]
warden-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_net"]
