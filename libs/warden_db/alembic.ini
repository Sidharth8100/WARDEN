# ==============================================================================
# alembic.ini  -  Alembic configuration file for warden_db
# ==============================================================================
#
# WHAT IS ALEMBIC?
# Alembic is a database migration tool. A "migration" is a Python script that
# describes a change to your database schema (create a table, add a column,
# etc.). Alembic keeps track of which migrations have already been applied so
# it never runs the same change twice. Think of it as git, but for your DB.
#
# HOW IS THIS FILE USED?
# When you run `alembic upgrade head`, Alembic reads this file to know:
#   - WHERE migration scripts live  (script_location)
#   - HOW to connect to the DB     (we override this in env.py from the env var)
# ==============================================================================

[alembic]

# %(here)s is a special token that expands to the directory containing THIS
# alembic.ini file. So if this file is at /app/db/alembic.ini, then
# script_location becomes /app/db/migrations.
script_location = %(here)s/migrations

# Migration file naming: revision-hash_short-description.py
# e.g. a3f2b1c4d5e6_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# prepend_sys_path tells Python where to look for importable modules when
# env.py runs. "." means the directory of this ini file (warden_db root).
# This allows `from warden_db.models import ...` to work inside env.py.
prepend_sys_path = .

# Max length of the "slug" part of the filename (the human-readable description)
truncate_slug_length = 40

# The database URL below is a PLACEHOLDER. We intentionally leave it pointing
# at a non-existent host so that if someone accidentally reads it from the ini
# file rather than env.py, they get an immediate connection error, not a
# connection to the wrong database.
# Our env.py reads the REAL URL from the WARDEN_DATABASE_URL environment variable.
sqlalchemy.url = postgresql+asyncpg://PLACEHOLDER/PLACEHOLDER


# ==============================================================================
# post_write_hooks - automatically format every generated migration file
# ==============================================================================
# Every time Alembic generates a new migration file, these hooks run to clean
# up the formatting so it passes our ruff linter automatically.
[post_write_hooks]
hooks = ruff_check,ruff_format

ruff_check.type = exec
ruff_check.executable = %(here)s/../../.venv/bin/ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = %(here)s/../../.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# ==============================================================================
# Logging configuration
# These control how much output Alembic prints while running migrations.
# ==============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
